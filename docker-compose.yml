version: "3.8"
services:
  mongo:
    image: mongo:6.0
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: blogdb

  backend:
    build:
      context: ./api
      dockerfile: Dockerfile
    image: yourdockerhubusername/mern-blog-backend:latest
    restart: unless-stopped
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongo:27017/blogdb
    depends_on:
      - mongo
    ports:
      - "5000:5000"

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    image: yourdockerhubusername/mern-blog-frontend:latest
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"
    environment:
      - REACT_APP_API_URL=http://localhost:5000/api

volumes:
  mongo_data:
